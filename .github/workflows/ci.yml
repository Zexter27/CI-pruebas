name: validacion pagina 1
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validacion:
    name: crear una maquina virtual 1
    runs-on: ubuntu-latest

    steps:
      - name: checkout repositorio
        uses: actions/checkout@v4

      - name: instalar node
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: validar codigo html
        run: |
          echo "inicio"
          npx html-validate "**/*.html"
          echo "fin"

